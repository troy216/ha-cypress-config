- id: '1770100000001'
  alias: 'Battery: Scheduled Charge Cycle'
  description: 'Charges FLA batteries on Tue/Fri at 8 AM. Stops when the ratio
    of two consecutive 5-minute current windows exceeds 0.98, indicating the
    charging curve has flattened and batteries are at equilibrium with the 13.3V
    charger. Minimum 15 minutes allows the sensor to accumulate data. Maximum
    48h is a safety cutoff.

    '
  use_blueprint:
    path: homeassistant/custom/battery_charge_cycle.yaml
    input:
      charger_switch: switch.zp_garage_outlet
      flatness_sensor: sensor.battery_charge_complete
      schedule_days:
      - tue
      - fri
      start_time: 08:00:00
      min_charge_minutes: 15
      max_charge_hours: 48
      flatness_ratio: 0.98
      min_current_floor: 0.5
      notify_service: notify.mobile_app_troys_iphone
- id: '1770100000002'
  alias: 'Battery: Charge Safety Watchdog'
  description: 'Independent safety net. If the outlet has been on continuously
    for 50 hours, something went wrong. Turn off and alert.

    '
  triggers:
  - trigger: state
    entity_id:
    - switch.zp_garage_outlet
    to:
    - 'on'
    for:
      hours: 50
      minutes: 0
      seconds: 0
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.zp_garage_outlet
  - action: notify.mobile_app_troys_iphone
    data:
      title: Battery Charger - WATCHDOG
      message: Outlet was on for 50+ hours. Turned off as safety measure.
  mode: single
- id: '1770100000003'
  alias: 'Battery: HA Restart Recovery'
  description: 'If HA restarts while a charge cycle is in progress, the main
    automation''s repeat loop dies but the outlet stays on. This automation
    triggers on HA start, waits 15 minutes for the flatness sensor to populate,
    then monitors every 5 minutes. If the curve is flat, it turns off the outlet.
    If not, it continues until flat or the watchdog takes over.

    '
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: switch.zp_garage_outlet
    state: 'on'
  actions:
  - action: notify.mobile_app_troys_iphone
    data:
      title: Battery Charger
      message: >
        HA restarted while charger was on. Monitoring will resume after
        flatness sensor populates (~15 minutes).
  - delay:
      minutes: 15
  - condition: state
    entity_id: switch.zp_garage_outlet
    state: 'on'
  - repeat:
      sequence:
      - delay:
          minutes: 5
      - condition: state
        entity_id: switch.zp_garage_outlet
        state: 'on'
      until:
      - condition: template
        value_template: >-
          {% set ratio = states('sensor.battery_charge_complete') %}
          {% set current_avg = state_attr('sensor.battery_charge_complete', 'current_avg') | float(0) %}
          {% set available = ratio not in ['unknown', 'unavailable'] %}
          {% if available %}
            {{ (ratio | float(0)) > 0.98 and current_avg > 0.5 }}
          {% else %}
            {{ false }}
          {% endif %}
  - condition: state
    entity_id: switch.zp_garage_outlet
    state: 'on'
  - action: switch.turn_off
    target:
      entity_id: switch.zp_garage_outlet
  - action: notify.mobile_app_troys_iphone
    data:
      title: Battery Charger
      message: >-
        Post-restart recovery complete. Charger turned off -- current curve
        was flat. Current avg: {{ state_attr('sensor.battery_charge_complete', 'current_avg') }}A,
        Ratio: {{ states('sensor.battery_charge_complete') }}.
  mode: single
- id: '1732294050048'
  alias: Office HVAC Update
  description: Update heat pump
  trigger:
  - platform: state
    entity_id: climate.office_hvac_air_conditioner
    attribute: current_temperature
  - platform: state
    entity_id: climate.office_thermostat
    attribute: current_temperature
  - platform: state
    entity_id: climate.office_thermostat
    attribute: temperature
  action:
  - variables:
      external_temp: '{{ states(''sensor.office_temperature'') | float }}'
      internal_temp: '{{ state_attr(''climate.office_hvac_air_conditioner'', ''current_temperature'')
        | float }}'
      target_temp: '{{ state_attr(''climate.office_thermostat'', ''temperature'')
        | float }}'
      temp_diff: '{{ abs(target_temp - internal_temp) }}'
      hvac_mode: '{{ ''heat'' if external_temp < internal_temp else ''cool'' }}'
      preset_mode: '{{ ''boost'' if temp_diff > 5 else ''none'' }}'
  - service: climate.set_temperature
    target:
      entity_id: climate.office_hvac_air_conditioner
    data:
      temperature: '{{ internal_temp + (target_temp - external_temp) }}'
  - service: climate.set_hvac_mode
    target:
      entity_id: climate.office_hvac_air_conditioner
    data:
      hvac_mode: '{{ hvac_mode }}'
  - service: climate.set_preset_mode
    target:
      entity_id: climate.office_hvac_air_conditioner
    data:
      preset_mode: '{{ preset_mode }}'
