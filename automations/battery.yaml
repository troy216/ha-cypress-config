- id: '1770100000001'
  alias: 'Battery: Scheduled Charge Cycle'
  description: 'Charges FLA batteries on Mon/Thu at 6 AM. Stops when the current draw
    curve flattens (1h and 4h rolling averages converge to within 5% of each other,
    ratio > 0.95), indicating batteries are at equilibrium with the 13.3V charger.
    Minimum 12h prevents false stops during the slow-decline phase. Maximum 24h is
    a safety cutoff.

    '
  use_blueprint:
    path: homeassistant/custom/battery_charge_cycle.yaml
    input:
      charger_switch: switch.zp_garage_outlet
      current_short_avg: sensor.battery_charger_current_1h_mean
      current_long_avg: sensor.battery_charger_current_4h_mean
      schedule_days:
      - tue
      - fri
      start_time: 08:00:00
      min_charge_hours: 1
      max_charge_hours: 48
      flatness_ratio: 0.98
      min_current_floor: 0.5
      notify_service: notify.mobile_app_troys_iphone
- id: '1770100000002'
  alias: 'Battery: Charge Safety Watchdog'
  description: 'Safety net for HA restarts mid-charge. If the outlet has been on continuously
    for 26 hours, something went wrong (the main automation''s repeat loop was likely
    lost during an HA restart). Turn off and alert. Set to 26h (slightly past the
    24h max) to avoid interfering with normal charge cycles.

    '
  triggers:
  - trigger: state
    entity_id:
    - switch.zp_garage_outlet
    to:
    - 'on'
    for:
      hours: 50
      minutes: 0
      seconds: 0
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.zp_garage_outlet
  - action: notify.mobile_app_troys_iphone
    data:
      title: Battery Charger - WATCHDOG
      message: Outlet was on for 26+ hours. Turned off as safety measure. This likely
        means HA restarted during a charge cycle.
  mode: single
- id: '1770100000003'
  alias: 'Battery: HA Restart Recovery'
  description: 'If HA restarts while a charge cycle is in progress, the main automation''s
    repeat loop dies but the outlet stays on. This automation triggers on HA start,
    waits for the statistics sensors to populate (4.5 hours), then monitors for flatness.
    If the curve is already flat (charging was nearly done), it turns off the outlet.
    If not, it continues monitoring hourly until flat or until the watchdog takes
    over.

    '
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: switch.zp_garage_outlet
    state: 'on'
  actions:
  - action: notify.mobile_app_troys_iphone
    data:
      title: Battery Charger
      message: HA restarted while charger was on. Monitoring will resume after statistics
        sensors repopulate (~4.5 hours).
  - delay:
      hours: 4
      minutes: 30
  - condition: state
    entity_id: switch.zp_garage_outlet
    state: 'on'
  - repeat:
      sequence:
      - delay:
          hours: 1
      - condition: state
        entity_id: switch.zp_garage_outlet
        state: 'on'
      until:
      - condition: template
        value_template: "{% set short = states('sensor.battery_charger_current_1h_mean')
          %} {% set long = states('sensor.battery_charger_current_4h_mean') %} {%
          set available = short not in ['unknown', 'unavailable']\n               and
          long not in ['unknown', 'unavailable'] %}\n{% if available %}\n  {% set
          s = short | float %}\n  {% set l = long | float %}\n  {% set ratio = ([s,
          l] | min) / ([s, l] | max) if ([s, l] | max) > 0 else 0 %}\n  {{ ratio >
          0.95 and s > 0.5 }}\n{% else %}\n  {{ false }}\n{% endif %}"
  - condition: state
    entity_id: switch.zp_garage_outlet
    state: 'on'
  - action: switch.turn_off
    target:
      entity_id: switch.zp_garage_outlet
  - action: notify.mobile_app_troys_iphone
    data:
      title: Battery Charger
      message: 'Post-restart recovery complete. Charger turned off -- current curve
        was flat (1h avg: {{ states(''sensor.battery_charger_current_1h_mean'') }}A,
        4h avg: {{ states(''sensor.battery_charger_current_4h_mean'') }}A).'
  mode: single
