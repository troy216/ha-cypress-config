- id: '1732294050048'
  alias: Office HVAC Update
  description: Update heat pump
  trigger:
  - platform: state
    entity_id: climate.office_hvac_air_conditioner
    attribute: current_temperature
  - platform: state
    entity_id: climate.office_thermostat
    attribute: current_temperature
  - platform: state
    entity_id: climate.office_thermostat
    attribute: temperature
  action:
  - variables:
      external_temp: '{{ states(''sensor.office_temperature'') | float }}'
      internal_temp: '{{ state_attr(''climate.office_hvac_air_conditioner'', ''current_temperature'')
        | float }}'
      target_temp: '{{ state_attr(''climate.office_thermostat'', ''temperature'')
        | float }}'
      temp_diff: '{{ abs(target_temp - internal_temp) }}'
      hvac_mode: '{{ ''heat'' if external_temp < internal_temp else ''cool'' }}'
      preset_mode: '{{ ''boost'' if temp_diff > 5 else ''none'' }}'
  - service: climate.set_temperature
    target:
      entity_id: climate.office_hvac_air_conditioner
    data:
      temperature: '{{ internal_temp + (target_temp - external_temp) }}'
  - service: climate.set_hvac_mode
    target:
      entity_id: climate.office_hvac_air_conditioner
    data:
      hvac_mode: '{{ hvac_mode }}'
  - service: climate.set_preset_mode
    target:
      entity_id: climate.office_hvac_air_conditioner
    data:
      preset_mode: '{{ preset_mode }}'
- id: '1768199536019'
  alias: Move heat on
  description: Turn on when bedroom AC temp is 3°F or more above bedroom sensor
  triggers:
  - trigger: template
    value_template: "{{ states('sensor.bedroom_temperature_2') | float(0) >=\n   states('sensor.bedroom_sensor_temperature')
      | float(0) + 3 }}"
  conditions: []
  actions:
  - type: turn_on
    device_id: bb21fcfcc913e431866a0b4452166426
    entity_id: 7b6575f5396e01f68bcab3e3a647afe9
    domain: switch
  mode: single
- id: '1768200924978'
  alias: Move heat off
  description: Turn off when bedroom AC temp is less than 3°F above bedroom sensor
  triggers:
  - trigger: template
    value_template: "{{ states('sensor.bedroom_temperature_2') | float(0) <\n   states('sensor.bedroom_sensor_temperature')
      | float(0) + 3 }}"
  conditions: []
  actions:
  - type: turn_off
    device_id: bb21fcfcc913e431866a0b4452166426
    entity_id: 7b6575f5396e01f68bcab3e3a647afe9
    domain: switch
  mode: single
