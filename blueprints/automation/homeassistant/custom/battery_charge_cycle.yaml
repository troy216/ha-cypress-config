# Battery Charge Cycle Blueprint
#
# Automates periodic charging of FLA (flooded lead-acid) batteries using a
# "dumb" constant-voltage charger controlled by a smart outlet with power
# monitoring. Designed for a 13.3V charger maintaining 2x4x12V marine
# batteries with active voltage balancers.
#
# HOW IT WORKS:
# The charger draws high current initially (e.g. 9A from 12.4V) that decays
# exponentially as batteries charge. Two statistics sensors compute rolling
# means of the AC current over different time windows (1h and 4h). While
# batteries are actively charging, the 1h mean (tracking recent, lower
# current) diverges from the 4h mean (which includes older, higher readings).
# When the curve flattens (batteries full), both means converge. The
# automation detects this convergence and stops charging.
#
# WHY SLOPE INSTEAD OF A THRESHOLD:
# The steady-state current (~0.76A in our setup) includes charger overhead
# and voltage balancer load -- not just battery charge current. An absolute
# threshold would need recalibration if the balancer load changes. Slope
# detection is self-calibrating: it stops when current stops changing,
# regardless of the absolute value.
#
# SAFETY:
# - 13.3V is well below the gassing threshold (14.1-14.4V), so extended
#   charging is not harmful to FLA batteries.
# - A minimum charge time prevents false stops during the initial current-
#   limited phase or early convergence of the statistics sensors.
# - A maximum charge time acts as a safety cutoff.
# - A minimum current floor (0.5A) detects charger failure or tripped
#   breakers -- if current is near zero, something is wrong.
# - Availability checks on statistics sensors prevent false flat detection
#   after HA restarts when sensors report "unknown".
#
# REQUIRES:
# Two statistics sensors defined in configuration.yaml:
#   sensor.battery_charger_current_1h_mean  (1-hour rolling mean)
#   sensor.battery_charger_current_4h_mean  (4-hour rolling mean)
# Both sourced from the charger outlet's current sensor.

blueprint:
  name: Battery Charge Cycle
  description: >
    Periodically charges FLA batteries via a smart outlet, stopping when
    the current draw curve flattens (slope-based detection). Uses two
    statistics sensors (short and long rolling averages) to detect when
    charging current has stabilized, indicating batteries are full.
  domain: automation

  input:
    charger_switch:
      name: Charger Outlet Switch
      description: The smart outlet that controls power to the charger.
      selector:
        entity:
          domain: switch

    current_short_avg:
      name: Short-Window Current Average
      description: >
        Statistics sensor computing a ~1-hour rolling mean of the charger
        outlet's current sensor. This tracks recent current levels.
      selector:
        entity:
          domain: sensor

    current_long_avg:
      name: Long-Window Current Average
      description: >
        Statistics sensor computing a ~4-hour rolling mean of the charger
        outlet's current sensor. This tracks the longer trend.
      selector:
        entity:
          domain: sensor

    schedule_days:
      name: Charge Days
      description: >
        Days of the week to start a charge cycle. For FLA batteries with
        active voltage balancers draining ~30-40% per 5 days, Monday and
        Thursday (every 3-4 days) keeps batteries above 80% SOC.
      default:
        - mon
        - thu
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun

    start_time:
      name: Start Time
      description: Time of day to begin the charge cycle.
      default: "06:00:00"
      selector:
        time: {}

    min_charge_hours:
      name: Minimum Charge Hours
      description: >
        Minimum hours to charge before slope detection activates. Prevents
        early stops from statistics sensor convergence during the initial
        high-current phase. 12 hours is recommended based on observed
        charging curves (the slow-decline phase at hours 10-12 can produce
        brief convergence that does not indicate full charge).
      default: 12
      selector:
        number:
          min: 1
          max: 48
          unit_of_measurement: hours

    max_charge_hours:
      name: Maximum Charge Hours
      description: >
        Safety maximum. Charging stops regardless of slope detection. At
        13.3V (below gassing threshold), extended charging is not harmful,
        but there is no benefit past the flat region either.
      default: 24
      selector:
        number:
          min: 1
          max: 72
          unit_of_measurement: hours

    flatness_threshold:
      name: Flatness Threshold
      description: >
        Maximum difference (in amps) between the short and long rolling
        averages to consider the curve "flat". Based on noise analysis:
        the standard deviation of the difference between 1h and 4h means
        is ~0.01A, so 0.03A (3 sigma) provides confident detection while
        avoiding false positives.
      default: 0.03
      selector:
        number:
          min: 0.005
          max: 0.5
          step: 0.005
          unit_of_measurement: A

    min_current_floor:
      name: Minimum Current Floor
      description: >
        If the short-window average drops below this value, the charger
        may have failed or the breaker tripped. The automation will send
        an alert instead of treating the low current as "flat". Set below
        the expected steady-state current (charger idle + load).
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
          unit_of_measurement: A

    notify_service:
      name: Notification Service
      description: Service to send charge start/stop notifications.
      default: notify.mobile_app_troys_iphone
      selector:
        text: {}

# mode: single prevents overlapping runs. If the repeat loop is still
# running when the next trigger fires, the new trigger is dropped. The
# outlet-is-off condition provides an additional guard.
mode: single

trigger:
  - platform: time
    at: !input start_time

condition:
  # Only start on configured days of the week
  - condition: template
    value_template: >-
      {{ now().strftime('%a') | lower in schedule_days }}
  # Don't start a new cycle if already charging (catches manual starts,
  # recovery automation already running, etc.)
  - condition: state
    entity_id: !input charger_switch
    state: "off"

variables:
  schedule_days: !input schedule_days
  short_avg_entity: !input current_short_avg
  long_avg_entity: !input current_long_avg
  flatness_threshold: !input flatness_threshold
  min_charge_hours: !input min_charge_hours
  max_charge_hours: !input max_charge_hours
  min_current_floor: !input min_current_floor
  notify_service: !input notify_service
  charge_start_ts: "{{ as_timestamp(now()) }}"

action:
  # --- Start charging ---
  - action: switch.turn_on
    target:
      entity_id: !input charger_switch

  - action: "{{ notify_service }}"
    data:
      title: "Battery Charger"
      message: "Charge cycle started."

  # --- Monitor loop: check every hour until flat or max time ---
  - repeat:
      sequence:
        - delay:
            hours: 1

        # Check if outlet was turned off externally (manual intervention)
        - if:
            - condition: state
              entity_id: !input charger_switch
              state: "off"
          then:
            - action: "{{ notify_service }}"
              data:
                title: "Battery Charger"
                message: >-
                  Charge cycle interrupted -- outlet was turned off
                  externally after {{ ((as_timestamp(now()) -
                  charge_start_ts) / 3600) | round(1) }} hours.
            - stop: "Outlet turned off externally"

      until:
        - condition: template
          value_template: >-
            {% set short_state = states(short_avg_entity) %}
            {% set long_state = states(long_avg_entity) %}
            {% set available = short_state not in ['unknown', 'unavailable']
                           and long_state not in ['unknown', 'unavailable'] %}
            {% set short_val = short_state | float(0) %}
            {% set long_val = long_state | float(0) %}
            {% set hours = ((as_timestamp(now()) - charge_start_ts) / 3600) %}
            {% set is_flat = available
                         and (short_val - long_val) | abs < flatness_threshold
                         and short_val > min_current_floor %}
            {{ (hours >= min_charge_hours and is_flat) or hours >= max_charge_hours }}

  # --- Stop charging ---
  - action: switch.turn_off
    target:
      entity_id: !input charger_switch

  - variables:
      final_hours: >-
        {{ ((as_timestamp(now()) - charge_start_ts) / 3600) | round(1) }}
      short_final: "{{ states(short_avg_entity) }}"
      long_final: "{{ states(long_avg_entity) }}"
      was_safety_cutoff: >-
        {{ ((as_timestamp(now()) - charge_start_ts) / 3600) >= max_charge_hours }}

  - action: "{{ notify_service }}"
    data:
      title: "Battery Charger"
      message: >-
        {% if was_safety_cutoff %}
          SAFETY CUTOFF after {{ final_hours }}h.
          Current: {{ short_final }}A.
          The slope did not flatten within the time limit -- check batteries.
        {% else %}
          Charge complete after {{ final_hours }}h.
          Final current: {{ short_final }}A (1h avg) / {{ long_final }}A (4h avg).
          Curve flattened within {{ flatness_threshold }}A tolerance.
        {% endif %}
