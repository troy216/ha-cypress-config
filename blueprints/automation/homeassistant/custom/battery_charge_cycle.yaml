# Battery Charge Cycle Blueprint
#
# Automates periodic charging of FLA (flooded lead-acid) batteries using a
# "dumb" constant-voltage charger controlled by a smart outlet with power
# monitoring. Designed for a 13.3V charger maintaining 2x4x12V marine
# batteries with active voltage balancers.
#
# HOW IT WORKS:
# The charger draws high current initially (e.g. 9A from 12.4V) that decays
# exponentially as batteries charge. A trigger-based template sensor
# (sensor.battery_charge_complete) stores the last ~10 minutes of current
# readings and computes the ratio of two consecutive 5-minute windows.
# When the ratio approaches 1.0, the current has stabilized and charging
# is complete.
#
# The ratio is dimensionless (0 to 1) and self-scaling -- it works
# regardless of the absolute current level. A ratio of 0.98 means the
# two consecutive 5-minute averages are within 2% of each other.
#
# WHY RATIO INSTEAD OF A THRESHOLD:
# The steady-state current (~0.76A in our setup) includes charger overhead
# and voltage balancer load -- not just battery charge current. An absolute
# threshold would need recalibration if the balancer load changes. The
# ratio is self-calibrating: it approaches 1.0 when current stops changing,
# regardless of the absolute value.
#
# SAFETY:
# - 13.3V is well below the gassing threshold (14.1-14.4V), so extended
#   charging is not harmful to FLA batteries.
# - A minimum charge time (min_charge_minutes) allows the sensor to
#   accumulate enough data for a meaningful ratio (~10 min warmup).
# - A maximum charge time acts as a safety cutoff.
# - A minimum current floor detects charger failure or tripped breakers --
#   if current is near zero, something is wrong.
# - The sensor outputs 0 until it has 20 readings, preventing false
#   flat detection after HA restarts.
#
# REQUIRES:
# A trigger-based template sensor (sensor.battery_charge_complete) defined
# in includes/template.yaml that outputs the ratio of consecutive 5-minute
# current windows and exposes a current_avg attribute.

blueprint:
  name: Battery Charge Cycle
  description: >
    Periodically charges FLA batteries via a smart outlet, stopping when
    the current draw curve flattens. Uses a ratio of consecutive 5-minute
    current windows to detect when charging current has stabilized,
    indicating batteries are full.
  domain: automation

  input:
    charger_switch:
      name: Charger Outlet Switch
      description: The smart outlet that controls power to the charger.
      selector:
        entity:
          domain: switch

    flatness_sensor:
      name: Charge Completeness Sensor
      description: >
        Trigger-based template sensor that outputs the ratio of two
        consecutive 5-minute current windows (0 to 1). Approaches 1.0
        when the charging curve is flat.
      selector:
        entity:
          domain: sensor

    schedule_days:
      name: Charge Days
      description: >
        Days of the week to start a charge cycle. For FLA batteries with
        active voltage balancers draining ~30-40% per 5 days, every 3-4
        days keeps batteries above 80% SOC.
      default:
        - mon
        - thu
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun

    start_time:
      name: Start Time
      description: Time of day to begin the charge cycle.
      default: "06:00:00"
      selector:
        time: {}

    min_charge_minutes:
      name: Minimum Charge Minutes
      description: >
        Minimum minutes before flatness detection activates. Must be at
        least 10 minutes to allow the sensor to accumulate enough readings
        for a meaningful ratio. Default 15 provides a small buffer.
      default: 15
      selector:
        number:
          min: 10
          max: 120
          unit_of_measurement: minutes

    max_charge_hours:
      name: Maximum Charge Hours
      description: >
        Safety maximum. Charging stops regardless of flatness detection.
        At 13.3V (below gassing threshold), extended charging is not
        harmful, but there is no benefit past the flat region either.
      default: 24
      selector:
        number:
          min: 1
          max: 72
          unit_of_measurement: hours

    flatness_ratio:
      name: Flatness Ratio
      description: >
        Ratio threshold for declaring the charging curve "flat". This is
        min(recent_5min, older_5min) / max(recent_5min, older_5min).
        When the two consecutive 5-minute averages converge (ratio
        approaches 1.0), the current is no longer declining. A value of
        0.98 means "the averages are within 2% of each other".
      default: 0.95
      selector:
        number:
          min: 0.5
          max: 1.0
          step: 0.01

    min_current_floor:
      name: Minimum Current Floor
      description: >
        If the recent current average drops below this value, the charger
        may have failed or the breaker tripped. The automation will not
        treat the low current as "flat". Set below the expected
        steady-state current (charger idle + load).
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
          unit_of_measurement: A

    notify_service:
      name: Notification Service
      description: Service to send charge start/stop notifications.
      default: notify.mobile_app_troys_iphone
      selector:
        text: {}

# mode: single prevents overlapping runs. If the repeat loop is still
# running when the next trigger fires, the new trigger is dropped. The
# outlet-is-off condition provides an additional guard.
mode: single

trigger:
  - platform: time
    at: !input start_time

condition:
  # Only start on configured days of the week
  - condition: template
    value_template: >-
      {{ now().strftime('%a') | lower in schedule_days }}
  # Don't start a new cycle if already charging (catches manual starts,
  # recovery automation already running, etc.)
  - condition: state
    entity_id: !input charger_switch
    state: "off"

variables:
  schedule_days: !input schedule_days
  flatness_entity: !input flatness_sensor
  flatness_ratio: !input flatness_ratio
  min_charge_minutes: !input min_charge_minutes
  max_charge_hours: !input max_charge_hours
  min_current_floor: !input min_current_floor
  notify_service: !input notify_service
  charge_start_ts: "{{ as_timestamp(now()) }}"

action:
  # --- Start charging ---
  - action: switch.turn_on
    target:
      entity_id: !input charger_switch

  - action: "{{ notify_service }}"
    data:
      title: "Battery Charger"
      message: "Charge cycle started."

  # --- Monitor loop: check every 5 minutes until flat or max time ---
  - repeat:
      sequence:
        - delay:
            minutes: 5

        # Check if outlet was turned off externally (manual intervention)
        - if:
            - condition: state
              entity_id: !input charger_switch
              state: "off"
          then:
            - action: "{{ notify_service }}"
              data:
                title: "Battery Charger"
                message: >-
                  Charge cycle interrupted -- outlet was turned off
                  externally after {{ ((as_timestamp(now()) -
                  charge_start_ts) / 60) | round(0) }} minutes.
            - stop: "Outlet turned off externally"

      until:
        - condition: template
          value_template: >-
            {% set ratio_state = states(flatness_entity) %}
            {% set current_avg = state_attr(flatness_entity, 'current_avg') | float(0) %}
            {% set available = ratio_state not in ['unknown', 'unavailable'] %}
            {% set ratio = ratio_state | float(0) %}
            {% set minutes = ((as_timestamp(now()) - charge_start_ts) / 60) %}
            {% set is_flat = available
                         and ratio > flatness_ratio
                         and current_avg > min_current_floor %}
            {{ (minutes >= min_charge_minutes and is_flat) or (minutes / 60) >= max_charge_hours }}

  # --- Stop charging ---
  - action: switch.turn_off
    target:
      entity_id: !input charger_switch

  - variables:
      final_minutes: >-
        {{ ((as_timestamp(now()) - charge_start_ts) / 60) | round(0) }}
      final_ratio: "{{ states(flatness_entity) }}"
      final_current: "{{ state_attr(flatness_entity, 'current_avg') }}"
      was_safety_cutoff: >-
        {{ ((as_timestamp(now()) - charge_start_ts) / 3600) >= max_charge_hours }}

  - action: "{{ notify_service }}"
    data:
      title: "Battery Charger"
      message: >-
        {% if was_safety_cutoff %}
          SAFETY CUTOFF after {{ (final_minutes | float / 60) | round(1) }}h.
          Current avg: {{ final_current }}A, Ratio: {{ final_ratio }}.
          The curve did not flatten within the time limit -- check batteries.
        {% else %}
          Charge complete after {{ final_minutes }} min
          ({{ (final_minutes | float / 60) | round(1) }}h).
          Final current avg: {{ final_current }}A.
          Flatness ratio: {{ final_ratio }}
          (threshold: {{ flatness_ratio }}).
        {% endif %}
