- cover:
    - name: "Garage Door"
      unique_id: garage_door
      state: >
        {% if is_state('binary_sensor.garage_door_state', 'on') %}
          open
        {% else %}
          closed
        {% endif %}
      open_cover:
        - action: switch.turn_on
          target:
            entity_id: switch.garage_door_relay
      close_cover:
        - action: switch.turn_on
          target:
            entity_id: switch.garage_door_relay
      stop_cover:
        - action: switch.turn_off
          target:
            entity_id: switch.garage_door_relay
      icon: >
        {% if is_state('binary_sensor.garage_door_state', 'on') %}
          mdi:garage-open
        {% else %}
          mdi:garage
        {% endif %}

# Battery charge completeness sensor.
# Time-based rolling window comparison for flatness detection.
# Two consecutive windows of size min(elapsed/2, 30min) are compared.
# Ratio approaches 1.0 when the charging curve flattens (batteries full).
# Requires 2+ readings per window. Clears state when charger switch is off.
- trigger:
    - platform: state
      entity_id: sensor.zp_garage_current
    - platform: state
      entity_id: switch.zp_garage_outlet
  sensor:
    - name: "Battery Charge Complete"
      unique_id: battery_charge_complete
      icon: mdi:battery-charging-100
      state_class: measurement
      state: >-
        {% set reading = states('sensor.zp_garage_current') | float(none) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set switch_on = is_state('switch.zp_garage_outlet', 'on') %}
        {% set prev_samples = this.attributes.samples | default([], true) %}
        {% set charge_start = this.attributes.charge_start_ts | default(0) | float(0) %}

        {% if charge_start > 0 %}
          {% set window_sec = ([((now_ts - charge_start) / 2) | int, 1800] | min) %}
        {% else %}
          {% set window_sec = 0 %}
        {% endif %}
        {% set recent_start = now_ts - window_sec %}
        {% set older_start  = now_ts - (2 * window_sec) %}
        {% set cutoff       = now_ts - 5400 %}

        {% set ns = namespace(
          recent_sum=0.0, recent_count=0,
          older_sum=0.0,  older_count=0
        ) %}
        {% for s in prev_samples %}
          {% if s[0] > cutoff %}
            {% if s[0] >= recent_start %}
              {% set ns.recent_sum   = ns.recent_sum   + s[1] %}
              {% set ns.recent_count = ns.recent_count + 1 %}
            {% elif s[0] >= older_start %}
              {% set ns.older_sum   = ns.older_sum   + s[1] %}
              {% set ns.older_count = ns.older_count + 1 %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if reading is not none and switch_on %}
          {% set ns.recent_sum   = ns.recent_sum   + reading %}
          {% set ns.recent_count = ns.recent_count + 1 %}
        {% endif %}

        {% if ns.recent_count >= 2 and ns.older_count >= 2 %}
          {% set r = ns.recent_sum / ns.recent_count %}
          {% set o = ns.older_sum  / ns.older_count %}
          {% if r > 0 and o > 0 %}
            {{ (([r, o] | min) / ([r, o] | max)) | round(4) }}
          {% else %}
            0
          {% endif %}
        {% else %}
          0
        {% endif %}

      attributes:
        samples: >-
          {% set reading = states('sensor.zp_garage_current') | float(none) %}
          {% set now_ts = as_timestamp(now()) %}
          {% set switch_on = is_state('switch.zp_garage_outlet', 'on') %}
          {% if not switch_on %}
            {{ [] }}
          {% else %}
            {% set cutoff = now_ts - 5400 %}
            {% set ns = namespace(result=[]) %}
            {% for s in this.attributes.samples | default([], true) %}
              {% if s[0] > cutoff %}
                {% set ns.result = ns.result + [s] %}
              {% endif %}
            {% endfor %}
            {{ (ns.result + [[now_ts, reading]]) if reading is not none else ns.result }}
          {% endif %}

        charge_start_ts: >-
          {% set now_ts = as_timestamp(now()) %}
          {% set prev = this.attributes.charge_start_ts | default(0) | float(0) %}
          {% if is_state('switch.zp_garage_outlet', 'on') %}
            {{ prev if prev > 0 else now_ts }}
          {% else %}
            {{ 0 }}
          {% endif %}

        window_size_minutes: >-
          {% set now_ts = as_timestamp(now()) %}
          {% set start = this.attributes.charge_start_ts | default(0) | float(0) %}
          {% if start > 0 %}
            {{ (([((now_ts - start) / 2) | int, 1800] | min) / 60) | round(1) }}
          {% else %}
            0
          {% endif %}

        recent_avg: >-
          {% set reading = states('sensor.zp_garage_current') | float(none) %}
          {% set now_ts = as_timestamp(now()) %}
          {% set switch_on = is_state('switch.zp_garage_outlet', 'on') %}
          {% set start = this.attributes.charge_start_ts | default(0) | float(0) %}
          {% set window_sec = ([((now_ts - start) / 2) | int, 1800] | min) if start > 0 else 0 %}
          {% set recent_start = now_ts - window_sec %}
          {% set cutoff = now_ts - 5400 %}
          {% set ns = namespace(sum=0.0, count=0) %}
          {% for s in this.attributes.samples | default([], true) %}
            {% if s[0] > cutoff and s[0] >= recent_start %}
              {% set ns.sum = ns.sum + s[1] %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}
          {% if reading is not none and switch_on %}
            {% set ns.sum = ns.sum + reading %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
          {{ (ns.sum / ns.count) | round(3) if ns.count > 0 else 0 }}

        # Startup peak (SC): running max of the raw current reading during the
        # first 120s, then latched for the rest of the cycle. Captures the true
        # startup peak even when a full battery tapers immediately. Resets when off.
        starting_current: >-
          {% set now_ts = as_timestamp(now()) %}
          {% set switch_on = is_state('switch.zp_garage_outlet', 'on') %}
          {% set start = this.attributes.charge_start_ts | default(0) | float(0) %}
          {% set prev_sc = this.attributes.starting_current | default(0) | float(0) %}
          {% set reading = states('sensor.zp_garage_current') | float(none) %}
          {% if not switch_on or start == 0 %}
            {{ 0 }}
          {% elif (now_ts - start) > 120 %}
            {{ prev_sc | round(3) }}
          {% elif reading is not none %}
            {{ [prev_sc, reading] | max | round(3) }}
          {% else %}
            {{ prev_sc | round(3) }}
          {% endif %}
