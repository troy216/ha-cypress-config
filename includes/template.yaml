- cover:
    - name: "Garage Door"
      unique_id: garage_door
      state: >
        {% if is_state('binary_sensor.garage_door_state', 'on') %}
          open
        {% else %}
          closed
        {% endif %}
      open_cover:
        - action: switch.turn_on
          target:
            entity_id: switch.garage_door_relay
      close_cover:
        - action: switch.turn_on
          target:
            entity_id: switch.garage_door_relay
      stop_cover:
        - action: switch.turn_off
          target:
            entity_id: switch.garage_door_relay
      icon: >
        {% if is_state('binary_sensor.garage_door_state', 'on') %}
          mdi:garage-open
        {% else %}
          mdi:garage
        {% endif %}
